name: Android CI

# Runs the unit tests, lint and debug builds named in AGENTS.md so pull
# requests are gated on them instead of relying on local runs only.
# Source-only: no signing secrets and no runtime authentication assets are
# provisioned here (see docs/RELEASE_SIGNING.md and SECURITY.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest already ships the Android SDK; setup-android@v3
          # still requests the removed "tools" package, so install the
          # exact packages the build needs with sdkmanager instead.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Run unit tests, lint and debug builds
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest \
            :mobile:lintDebug :home:lintDebug :maphost:lintDebug \
            :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug
